<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><script src=https://telegram.org/js/telegram-web-app.js></script><link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#0b0b14;color:#fff;padding:0 0 90px 0}.view{display:none}.view.active{display:block}.header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}.logo{width:34px;height:34px;background:linear-gradient(135deg,#00d68f,#00ff88);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000}.xp-card{margin:15px;background:#181826;border-radius:22px;padding:22px;display:flex;justify-content:space-between;align-items:center;border:1px solid #23233a}.btn-row{display:flex;gap:12px;padding:0 16px}.btn{flex:1;padding:16px;border-radius:14px;border:none;font-weight:700;font-size:15px;cursor:pointer}.btn-earn{background:#00d68f;color:#000}.btn-with{background:#1e1e32;color:#fff;border:1px solid #2a2a45}.notice{background:#1a1a2e;border:1px dashed #00d68f;margin:12px 16px;padding:12px 14px;border-radius:12px;font-size:12px;color:#a0a0c0}.stats{display:flex;gap:12px;padding:16px}.stat{flex:1;background:#181826;padding:18px 10px;border-radius:18px;text-align:center;border:1px solid #23233a}.checkin{margin:16px;background:linear-gradient(135deg,#00b073,#00d68f 50%,#00ff88);border-radius:22px;padding:20px}.ad-card{margin:12px 16px;background:#181826;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px solid #23233a}.watch-btn{background:#5ac8ff;color:#000;border:none;padding:10px 22px;border-radius:20px;font-weight:800}.watch-btn:disabled{background:#333;color:#777}.wallet-box{margin:12px 16px;background:#181826;border-radius:18px;padding:16px;border:1px solid #23233a}.wallet-input{background:#0b0b14;border:1px solid #23233a;color:#fff;padding:12px;border-radius:10px;width:100%;margin-top:8px;font-size:13px}.ref-link{background:#fff;color:#000;padding:14px;border-radius:12px;margin:12px 0;word-break:break-all;font-size:14px;font-weight:700;border:2px solid #00d68f;text-align:center}.copy-btn{background:#00d68f;color:#000;border:none;padding:14px 24px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;font-size:15px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#11111f;display:flex;justify-content:space-around;align-items:center;padding:10px 0 22px 0;border-top:1px solid #1e1e32}.nav-item{text-align:center;color:#5a5a7a;font-size:10px;font-weight:600;cursor:pointer}.nav-item.active{color:#00d68f}.nav-item i{font-size:20px;display:block;margin-bottom:5px}.center-btn{width:62px;height:62px;background:linear-gradient(135deg,#ff9f0a,#ffcf5a);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-28px;border:4px solid #11111f;font-size:26px;color:#000}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#00d68f;color:#000;padding:14px 20px;border-radius:12px;font-weight:800;z-index:9999;display:none;text-align:center;max-width:85%}.limit-badge{background:#ff9f0a;color:#000;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:800;margin-left:6px}</style></head><body><div id=toast class=toast></div><div class=header><div style=display:flex;align-items:center;gap:10px><div class=logo><i class='fa-solid fa-dollar-sign'></i></div><div><b>USDT Earn</b><br><small style=color:#5a5a7a id=uname>@user</small></div></div><div style=color:#00ff88;font-size:12px><i class='fa-solid fa-circle' style=font-size:8px></i> Online</div></div><div id=homeView class='view active'><div class=xp-card><div><p style=color:#6b6b8a;font-size:11px>YOUR BALANCE (DB)</p><h1 id=bal style=font-size:28px;margin-top:6px>Loading...</h1></div><div style=width:70px;height:70px;background:linear-gradient(135deg,#00d68f,#00ff88);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#000;font-size:32px><i class='fa-solid fa-dollar-sign'></i></div></div><div class=notice><i class='fa-solid fa-circle-info' style=color:#00d68f></i> Min: <b>3 USDT</b> | <b>Monday Only</b> | <b>2-5 sec arrival</b></div><div class=btn-row><button class='btn btn-earn' onclick=showView('earn')><i class='fa-solid fa-bolt'></i> Earn</button><button class='btn btn-with' onclick=withdraw()><i class='fa-solid fa-wallet'></i> Withdraw</button></div><div class=stats><div class=stat><p style=color:#6b6b8a;font-size:11px>Tasks</p><h3 id=tasksCount>DB</h3></div><div class=stat><p style=color:#6b6b8a;font-size:11px>Streak</p><h3 id=streak>DB</h3></div><div class=stat onclick=showView('account')><p style=color:#6b6b8a;font-size:11px>Refs</p><h3 id=refs>0</h3></div></div></div><div id=earnView class=view><div style=padding:12px 16px;font-weight:700><i class='fa-solid fa-play'></i> Watch & Earn (DB Verified)</div><div class=ad-card><div style=display:flex;gap:12px;align-items:center><div style=width:52px;height:52px;background:#1c8ef8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff><i class='fa-solid fa-play'></i></div><div><b>AD 1</b> <span class=limit-badge id=ad1Limit>0/5</span><br><small style=color:#00d68f>0.01 USDT - 5/day</small></div></div><button class=watch-btn id=ad1Btn onclick=watchAd('ad1')><i class='fa-solid fa-play'></i> Watch</button></div><div class=ad-card><div style=display:flex;gap:12px;align-items:center><div style=width:52px;height:52px;background:#ff5a5a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff><i class='fa-solid fa-play'></i></div><div><b>AD 2</b> <span class=limit-badge id=ad2Limit>0/7</span><br><small style=color:#00d68f>0.025 USDT - 7/day</small></div></div><button class=watch-btn id=ad2Btn onclick=watchAd('ad2')><i class='fa-solid fa-play'></i> Watch</button></div></div><div id=accountView class=view><div class=wallet-box><b><i class='fa-solid fa-wallet'></i> Wallet (TRC20)</b><input id=walletAddr class=wallet-input placeholder='Enter T... address' /><div style=display:flex;gap:8px;margin-top:10px><button class=copy-btn style=flex:1;background:#1e1e32;color:#fff;border:1px solid #2a2a45 onclick=withdraw()><i class='fa-solid fa-money-bill-transfer'></i> Withdraw 3 USDT</button></div></div><div class=wallet-box><b><i class='fa-solid fa-user-plus'></i> Invite - 0.25 per friend DB</b><div class=ref-link id=refLink>Loading...</div><button class=copy-btn onclick=copyRef()><i class='fa-solid fa-copy'></i> COPY LINK 0.25</button></div></div><div class=bottom-nav><div class='nav-item active' onclick=showView('home')><i class='fa-solid fa-house'></i>Home</div><div class=nav-item onclick=showView('earn')><i class='fa-solid fa-bolt'></i>Earn</div><div class=center-btn onclick=showView('earn')><i class='fa-solid fa-dollar-sign'></i></div><div class=nav-item onclick=showView('account')><i class='fa-solid fa-user'></i>Account</div><div class=nav-item><i class='fa-solid fa-ellipsis'></i>More</div></div><script>
let tg=window.Telegram.WebApp;tg.expand();
let userId=tg.initDataUnsafe?.user?.id||Math.floor(Math.random()*1000000);
let username=tg.initDataUnsafe?.user?.username||'user';
let botUsername='earning_12_1_bot';
let balance=0; let counts={ad1:0,ad2:0};
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');}
function updateUI(){
  document.getElementById('bal').innerText=parseFloat(balance).toFixed(3)+' USDT';
  document.getElementById('uname').innerText='@'+username;
  document.getElementById('ad1Limit').innerText=counts.ad1+'/5';
  document.getElementById('ad2Limit').innerText=counts.ad2+'/7';
  if(counts.ad1>=5){let b=document.getElementById('ad1Btn');b.innerHTML='Limit';b.disabled=true;}
  if(counts.ad2>=7){let b=document.getElementById('ad2Btn');b.innerHTML='Limit';b.disabled=true;}
  document.getElementById('refLink').innerText='https://t.me/'+botUsername+'?start='+userId;
}
async function init(){
  let ref=new URLSearchParams(window.location.search).get('ref') || tg.initDataUnsafe?.start_param;
  let res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,referred_by:ref})});
  let data=await res.json();
  balance=data.balance; counts=data.counts; updateUI();
}
async function watchAd(type){
  let btn=document.getElementById(type==='ad1'?'ad1Btn':'ad2Btn');
  btn.innerHTML='Watching 10s...'; btn.disabled=true;
  setTimeout(async()=>{
    let res=await fetch('/api/watch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,ad_type:type,provider_event_id:userId+'_'+type+'_'+Date.now()})});
    let data=await res.json();
    if(data.ok){balance=data.balance; counts=data.counts; updateUI(); showToast('+'+data.reward+' USDT!');}
    else{showToast(data.message); btn.disabled=false; btn.innerHTML='Watch';}
    btn.disabled=false; btn.innerHTML='Watch';
  },10000);
}
async function withdraw(){
  let wallet=document.getElementById('walletAddr').value;
  if(wallet.length<10){showToast('Enter wallet!'); showView('account'); return;}
  if(parseFloat(balance)<3){showToast('Min 3 USDT! You: '+parseFloat(balance).toFixed(3)); return;}
  let res=await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,amount:balance,network:'TRC20',wallet:wallet})});
  let data=await res.json();
  if(data.ok){showToast('Withdrawal submitted!'); balance=0; updateUI();}
  else showToast(data.message);
}
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLink').innerText).then(()=>showToast('Copied!'));}
init();
</script></body></html>
