services:
    - type: web
    name: earni-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
            - key: BOT_TOKEN
        sync: false
            - key: MONGO_URL
        sync: false
            - key: BOT_USERNAME
        sync: false
            - key: MINI_APP_URL
        sync: false
            - key: ADMIN_ID
        value: 8323896060
